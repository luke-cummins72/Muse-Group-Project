<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muse - User Profile</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Krub">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <link rel="stylesheet" type="text/css" href="/assets/css/style.css">
</head>
<body>

<header id="header-container">
    <div class="logo">
        <a href="/MuseGallery/Index">
            <img src="/assets/images/logoIcons/Logo.png" alt="Logo">
        </a>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark" id="myTopnav">
        <a href="/MuseGallery/Index">Home</a>
        <a href="/MuseGallery/About">About Us</a>
        <a href="/projects/allProjects">Projects</a>
        <a href="/showcases/allShowcases">Showcases</a>

        <div th:if="${userLoggedIn == null}">
            <div class="dropdown">
                <button class="dropbtn"><i class='fas fa-user-circle' style="font-size: 30px"></i></button>
                <div class="dropdown-content">
                    <a href="/MuseGallery/Register">Register</a>
                    <a href="/MuseGallery/Login">Log In</a>
                </div>
            </div>
        </div>

        <div th:if="${userLoggedIn != null}">
            <div class="dropdown">
                <button class="dropbtn"><img class="profilePic" th:src="@{'/assets/images/users/' + ${userLoggedIn.userImage}}"></button>
                <div class="dropdown-content">
                    <a th:href="@{'/user/' + ${userLoggedIn.userType} + 'Dashboard'}" class="active">Profile</a>
                    <a href="/MuseGallery/logout">Log out</a>
                </div>
            </div>
        </div>
        <a href="javascript:void(0);" style="font-size:20px;" class="icon" onclick="myFunction()">&#9776;</a>
    </nav>
</header>

<div class="grid-container">
    <h1 class="profileName"><span th:text="${user.firstName}"></span>'s Profile</h1>

    <div class="form-container" id="profile">
        <div class="viewImage">
            <img th:src="@{/assets/images/users/{filename}(filename=${user.userImage})}" alt="Profile Image" />
        </div>

        <label for="fullName">First Name & Surname:</label>
        <input type="text" id="fullName" th:value="${user.firstName} + ' ' + ${user.surname}" readonly />

        <label for="username">Username:</label>
        <input type="text" id="username" th:value="${user.userName}" readonly />

        <label for="email">Email:</label>
        <input type="text" id="email" th:value="${user.email}" readonly />

        <label for="bio">Bio:</label>
        <textarea id="bio" th:text="${user.bio}" rows="4" readonly></textarea>

        <div th:if="${userLoggedIn != null && userLoggedIn.id == user.id}">
            <a th:href="@{'/user/' + ${user.userType} + 'Dashboard'}">
                <button type="button" class="backButton btn">Back</button>
            </a>
        </div>
        <div th:if="${userLoggedIn != null && userLoggedIn.id != user.id}">
            <a href="/projects/allProjects">
                <button type="button" class="backButton btn">Back</button>
            </a>
        </div>
        <div th:if="${userLoggedIn == null}">
            <a href="/projects/allProjects">
                <button type="button" class="backButton btn">Back</button>
            </a>
        </div>


    </div>

    <div class="projects" th:if="${user.userType == 'student'}">
    <!-- Display user's projects -->
    <h1 class="profileName"><span th:text="${user.firstName}"></span>'s Projects</h1>

    <!-- Check if the user has any projects -->
    <div th:if="${#lists.isEmpty(userProjects)}">
        <p>This user has no projects.</p>
    </div>

    <div th:if="${not #lists.isEmpty(userProjects)}" class="row">
        <div class="col-lg-4 col-md-6 col-sm-12 mb-4" th:each="project : ${userProjects}">
            <div class="cards">
                <a th:href="@{'/projects/' + ${project.projectId}}">
                    <img th:src="@{'/assets/images/projects/thumbnail/thumb_' + ${project.projectImage}}" class="card-img-top" alt="Project Image" />
                    <div class="card-content">
                        <h3 class="card-title" th:text="${project.projectName}"></h3>
                        <p class="card-text" th:text="${project.shortDescription}"></p>
                    </div>
                </a>
            </div>
        </div>
    </div>

</div>
</div>

<footer id="footer-container" class="bacasime-antique-regular">
    <div class="footer-line1">
        <p>We are Muse</p>
        <a class="sub-text">Our Ethos</a>
        <p class="sub-text2">Getting Involved</p>
    </div>
    <hr class="footer-hr1">

    <div class="find-your-muse">
        <p>FIND YOUR MUSE</p>
    </div>
    <hr class="footer-hr2">

    <div class="footer-line2">
        <p class="sub-text3">Find us on</p>
        <p>
            <a href="#" class="fa-brands fa-instagram"></a>
            <a href="#" class="fa-brands fa-pinterest"></a>
            <a href="#" class="fa-brands fa-youtube"></a>
            <a href="#" class="fa-brands fa-twitter"></a>
        </p>
    </div>

    <div class="footer-divider">
        <hr>
    </div>

    <img class="footer-logo" src="/assets/images/logoIcons/logo-footer.png">
    <div class="footer-texts">
        <div class="footer-text1"> <p>&copy; 2024 Muse</p> </div>
        <div class="footer-text2"> <p>Terms & Conditions</p> </div>
        <div class="footer-text3"> <p>Privacy Policy</p> </div>
        <div class="footer-text4"> <p>Cookie Policy</p> </div>
        <div class="footer-text5"> <p>Accessibility</p> </div>
    </div>
    <div class="globe"> <i class="fa fa-globe" style="font-size:16px"></i></div>
    <div class="footer-text6"><p>Ireland | English</p> </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
