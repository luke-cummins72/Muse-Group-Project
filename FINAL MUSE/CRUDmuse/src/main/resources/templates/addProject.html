<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muse - Add Project</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Krub">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">

  <link rel="stylesheet" type="text/css" href="/assets/css/style.css">
</head>
<body>
<header id="header-container">

  <div class="logo">
    <a href="/MuseGallery/Index">
      <img src="/assets/images/logoIcons/Logo.png" alt="Logo">
    </a>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark" id="myTopnav">
    <a href="/MuseGallery/Index">Home</a>
    <a href="/MuseGallery/About">About Us</a>
    <a href="/projects/allProjects">Projects</a>
    <a href="/showcases/allShowcases">Showcases</a>

    <div th:if="${user == null}">
      <div class="dropdown">
        <button class="dropbtn"><i class='fas fa-user-circle' style="font-size: 30px"></i></button>
        <div class="dropdown-content">
          <a href="/MuseGallery/Register">Register</a>
          <a href="/MuseGallery/Login">Log In</a>
        </div>
      </div>
    </div>

    <div th:if="${user != null}">
      <div class="dropdown">
        <button class="dropbtn"><img class="profilePic" th:src="@{'/assets/images/users/' + ${user.userImage}}"></button>
        <div class="dropdown-content">
          <a th:href="@{'/user/' + ${user.userType} + 'Dashboard'}" class="active">Profile</a>
          <a href="/MuseGallery/logout">Log out</a>
        </div>
      </div>
    </div>
    <a href="javascript:void(0);" style="font-size:20px;" class="icon" onclick="myFunction()">&#9776;</a>
  </nav>

</header>

<div class="grid-container">

  <h1>Add a Project</h1>
  <hr class="title-hr"><form th:action="@{/projects/addProject}" th:object="${newProject}" method="post" enctype="multipart/form-data" class="form-container" id="addProject">

  <input type="hidden" th:field="*{projectImage}">
  <div class="addImage">
    <img src="/assets/images/empty.jpg">
    <div class="addImageContent">
      <input type="file" id="projectImageFile" name="projectImageFile" required>
    </div>
  </div>
  <span th:if="${#fields.hasErrors('projectName')}" th:errors="*{projectName}" class="error"></span>
  <input type="text" id="projectName" th:field="*{projectName}" placeholder="Enter Project Name"  />

  <span th:if="${#fields.hasErrors('shortDescription')}" th:errors="*{shortDescription}" class="error"></span>
  <textarea id="shortDescription" th:field="*{shortDescription}" rows="1" placeholder="Enter Short Description" ></textarea>

  <span th:if="${#fields.hasErrors('longDescription')}" th:errors="*{longDescription}" class="error"></span>
  <textarea id="longDescription" th:field="*{longDescription}" rows="3" placeholder="Enter Long Description" ></textarea>

  <label for="dateCreated">Date Created:</label>
  <span th:if="${#fields.hasErrors('dateCreated')}" th:errors="*{dateCreated}" class="error">&nbsp; | &nbsp;</span>
  <span th:if="${#fields.hasErrors('documentOne')}" th:errors="*{documentOne}" class="error"></span>
  <br>
    <input type="date" id="dateCreated" th:field="*{dateCreated}" name="dateCreated" >

  <input type="hidden" th:field="*{documentOne}">
  <input type="file" id="documentOneFile" name="documentOneFile" required>

  <select name="showcaseId" class="form-select">
    <option disabled>Select Showcase</option>
    <option value="0">No Showcase</option>
    <th:block th:each="upcomingShowcases : ${upcomingShowcase}">
      <option th:value="${upcomingShowcases.showcaseId}" th:text="${upcomingShowcases.showcaseName}"></option>
    </th:block>
  </select>



  <div class="button-group">
    <a href="/user/manageProject"><button type="button" class="backButton btn">Back</button></a>
    <button type="submit" class="addButton btn">Add Project</button>
  </div>
</form>
</div>

<footer id="footer-container" class="bacasime-antique-regular">

  <div class="footer-line1" >
    <p>We are Muse</p>
    <a class="sub-text">Our Ethos</a>
    <p class="sub-text2">Getting Involved</p>
  </div>

  <hr class="footer-hr1">

  <div class="find-your-muse">
    <p>FIND YOUR MUSE</p>
  </div>
  <hr class="footer-hr2">

  <div class="footer-line2">
    <p class="sub-text3">Find us on</p>

    <p><a href="#" class="fa-brands fa-instagram"></a>

      <a href="#" class="fa-brands fa-pinterest"></a>

      <a href="#" class="fa-brands fa-youtube"></a>

      <a href="#" class="fa-brands fa-twitter"></a></p>
  </div>

  <div class="footer-divider">
    <hr>
  </div>

  <img class="footer-logo" src="assets/images/logoIcons/logo-footer.png">
  <div class="footer-texts">
    <div class="footer-text1"> <p>&copy; 2024 Muse</p> </div>
    <div class="footer-text2"> <p>Terms & Conditions</p> </div>
    <div class="footer-text3"> <p>Privacy Policy</p> </div>
    <div class="footer-text4"> <p>Cookie Policy</p> </div>
    <div class="footer-text5"> <p>Accessibility</p> </div>
  </div>
  <div class="globe"> <i class="fa fa-globe" style="font-size:16px"></i></div>
  <div class="footer-text6"><p>Ireland | English</p> </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
