<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muse - Edit Showcase</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Krub">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <link rel="stylesheet" type="text/css" href="/assets/css/style.css">
</head>
<body>
<header id="header-container">

    <div class="logo">
        <a href="/MuseGallery/Index">
            <img src="/assets/images/logoIcons/Logo.png" alt="Logo">
        </a>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark" id="myTopnav">
        <a href="/MuseGallery/Index" >Home</a>
        <a href="/MuseGallery/About">About Us</a>
        <a href="/projects/allProjects">Projects</a>
        <a href="/showcases/allShowcases">Showcases</a>

            <div class="dropdown">

                <button class="dropbtn"><img class="profilePic" th:src="@{'/assets/images/users/' + ${user.userImage}}"></button>
                <div class="dropdown-content">
                    <a th:href="@{'/user/adminDashboard'}" class="active">Profile</a>
                    <a href="/MuseGallery/logout">Log out</a>
                </div>
            </div>
        <a href="javascript:void(0);" style="font-size:20px;" class="icon" onclick="myFunction()">&#9776;</a>
    </nav>

</header>
<div class="grid-container">
    <h1>Edit Showcase</h1>
    <hr class="title-hr">

    <form th:action="@{/showcases/saveShowcase}" th:object="${aShowcase}" class="form-container" id="editShowcase" method="post" enctype="multipart/form-data">

        <input type="hidden" th:field="*{showcaseImage}" />
        <div class="addImage">
                <img th:src="@{/assets/images/showcases/{filename}(filename=${aShowcase.showcaseImage})}" alt="Showcase Image" />
                <div class="addImageContent">
                    <input type="file" id="showcaseImageFile" name="showcaseImageFile" required/>
                </div>
        </div>

        <span th:if="${#fields.hasErrors('showcaseName')}" th:errors="*{showcaseName}" style="color: red;"></span>
        <input type="text" id="showcaseName" th:field="*{showcaseName}" placeholder="Enter Showcase Name" required />

        <span th:if="${#fields.hasErrors('shortDescription')}" th:errors="*{shortDescription}" style="color: red;"></span>
        <textarea id="shortDescription" th:field="*{shortDescription}" rows="2" placeholder="Enter Short Description" required></textarea>

        <span th:if="${#fields.hasErrors('longDescription')}" th:errors="*{longDescription}" style="color: red;"></span>
        <textarea id="longDescription" th:field="*{longDescription}" rows="4" placeholder="Enter Long Description" required></textarea>

        <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" style="color: red;"></span>
        <select name="showcaseStatus" id="showcaseStatus" th:field="*{status}">
                <option value="">Showcase Status</option>
                <option value="Live">Live</option>
                <option value="Upcoming">Upcoming</option>
                <option value="Archived">Archived</option>
            </select>

        <select name="top" id="top" th:field="*{top}">
            <option value="" disabled>Top Showcase?</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>


        <span th:if="${#fields.hasErrors('submissionDeadline')}" th:errors="*{submissionDeadline}" style="color: red;"></span>
        <input type="date" id="submissionDeadline" th:field="*{submissionDeadline}" placeholder="Enter Submission Deadline" >

        <input type="hidden" id="showcaseId" th:field="*{showcaseId}">

        <a href="/user/manageShowcase">
            <button type="button" class="backButton btn">Back</button>
        </a>

        <button type="submit" class="updateButton btn">Update Showcase</button>

    </form>
</div>

<footer id="footer-container" class="bacasime-antique-regular">

    <div class="footer-line1" >
        <p>We are Muse</p>
        <a class="sub-text">Our Ethos</a>
        <p class="sub-text2" >Getting Involved</p>
    </div>

    <hr class="footer-hr1">

    <div class="find-your-muse">
        <p>FIND YOUR MUSE</p>
    </div>
    <hr class="footer-hr2">

    <div class="footer-line2">
        <p class="sub-text3">Find us on</p>

        <p><a href="#" class="fa-brands fa-instagram"></a>

            <a href="#" class="fa-brands fa-pinterest"></a>

            <a href="#" class="fa-brands fa-youtube"></a>

            <a href="#" class="fa-brands fa-twitter"></a></p>
    </div>

    <div class="footer-divider">
        <hr>
    </div>

    <img class="footer-logo" src="assets/images/logoIcons/logo-footer.png">
    <div class="footer-texts">
        <div class="footer-text1"> <p>&copy; 2024 Muse</p> </div>
        <div class="footer-text2"> <p>Terms & Conditions</p> </div>
        <div class="footer-text3"> <p>Privacy Policy</p> </div>
        <div class="footer-text4"> <p>Cookie Policy</p> </div>
        <div class="footer-text5"> <p>Accessibility</p> </div>
    </div>
    <div class="globe"> <i class="fa fa-globe" style="font-size:16px"></i></div>
    <div class="footer-text6"><p>Ireland | English</p> </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
